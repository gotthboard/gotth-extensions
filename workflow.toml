requires_migration_down = false

[[feature.repository-boundary-v1.interface]]
name = "Concrete extension repository contract"
kind = "repository-policy"
stability = "unreleased"
change = "new"

[[feature.repository-boundary-v1.verification]]
id = "documentation-contract"
kind = "review"
command = "make verify"
required = true
timeout_seconds = 1200
side_effect = "local_write"
network = false
retries = 0
